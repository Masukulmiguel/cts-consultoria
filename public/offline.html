<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0054AE" />
    <title>Sem ligação | CTS Consultoria</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f6f8fb;
        color: #0b1b2f;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #fff;
        border: 1px solid #e3e9f2;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 18px 40px -28px rgb(11 27 47 / 45%);
      }
      img {
        width: 72px;
        height: auto;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 1.35rem;
        line-height: 1.25;
      }
      p {
        margin: 0 0 22px;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #5a6b82;
      }
      a {
        display: inline-block;
        background: #0054ae;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
        padding: 12px 22px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/brand/cts-mark.png" alt="CTS Consultoria" />
      <h1>Sem ligação à internet</h1>
      <p>
        Não foi possível carregar esta página. Verifique a sua ligação e tente novamente — os
        serviços da CTS continuam disponíveis por telefone e WhatsApp.
      </p>
      <a href="/pt">Voltar ao início</a>
    </main>
  </body>
</html>
